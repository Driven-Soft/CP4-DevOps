services:

  argos-mysql:
    build:
      context: .
      dockerfile: docker/database/Dockerfile

    container_name: argos-mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: argos
      MYSQL_USER: argos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

  argos-api:
    build: 
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: argos-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ArgosMySql: Server=argos-mysql;Port=3306;Database=argos;User=argos;Password=${MYSQL_PASSWORD}

    depends_on:
      - argos-mysql

    restart: always

volumes:
  mysql_data: